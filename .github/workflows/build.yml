name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Descompactar e achar o projeto
        run: |
          unzip -q *.zip -d src
          DIR=$(dirname "$(find src -name 'settings.gradle*' | head -n 1)")
          echo "PROJ=$DIR" >> $GITHUB_ENV
          echo "Projeto encontrado em: $DIR"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar
        working-directory: ${{ env.PROJ }}
        run: |
          if [ -f gradlew ]; then chmod +x gradlew && ./gradlew assembleDebug; else gradle assembleDebug; fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJ }}/**/build/outputs/apk/debug/*.apk
